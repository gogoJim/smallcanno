<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測試點位 3D 視覺化</title>
    <!-- 引入 Three.js 核心庫和輔助庫 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-left: 4px solid #4CAF50;
            max-width: 350px;
            backdrop-filter: blur(5px);
        }
        #info h1 {
            margin: 0 0 10px 0;
            font-size: 20px;
            color: #4CAF50;
        }
        #info p {
            margin: 5px 0;
            font-size: 14px;
            color: #eee;
        }
        #info .highlight {
            color: #4CAF50;
            font-weight: bold;
        }
        #controls-note {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: #ccc;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
            backdrop-filter: blur(5px);
        }
        
        /* 右下角容器 */
        #bottom-right-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
            max-width: 280px;
        }
        
        /* 顯示切換面板 */
        #toggle-switch {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 4px solid #FF5722;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #toggle-switch h4 {
            margin: 0 0 12px 0;
            color: #FF5722;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .toggle-option {
            display: flex;
            align-items: center;
            margin: 8px 0;
            gap: 10px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .toggle-option:hover {
            background-color: rgba(255, 87, 34, 0.2);
        }
        .toggle-option input[type="radio"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #FF5722;
        }
        .toggle-option label {
            cursor: pointer;
            font-size: 14px;
            flex: 1;
        }
        .toggle-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            background-color: rgba(255,255,255,0.15);
        }
        .badge-expected { color: #4CAF50; }
        .badge-actual { color: #e74c3c; }
        
        /* 角度對應面板 */
        .coordinate-note {
            background: rgba(0, 0, 0, 0.8);
            color: #FFAA00;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 13px;
            border-left: 4px solid #FFAA00;
            backdrop-filter: blur(5px);
            line-height: 1.5;
        }
        .coordinate-note strong {
            color: #FFAA00;
        }
        
        /* 圖例面板 */
        #legend {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            z-index: 100;
            border-left: 4px solid #4CAF50;
            min-width: 180px;
            backdrop-filter: blur(5px);
        }
        #legend h3 {
            margin: 0 0 12px 0;
            font-size: 15px;
            color: #4CAF50;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
            gap: 10px;
            font-size: 13px;
        }
        .color-box {
            width: 18px;
            height: 18px;
            border-radius: 50%;
        }
        .color-box.green { background: #4CAF50; }
        .color-box.red { background: #e74c3c; }
        .color-box.orange { background: #FF5722; }
        .color-box.blue { background: #3498db; }
        
        .close-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 87, 34, 0.9);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1000;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 14px;
        }
        .close-btn:hover {
            background: #FF5722;
            transform: scale(1.05);
        }
        
        .point-tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.95);
            color: white;
            padding: 12px 18px;
            border-radius: 6px;
            font-size: 13px;
            pointer-events: none;
            z-index: 200;
            border-left: 4px solid #4CAF50;
            display: none;
            max-width: 300px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            line-height: 1.6;
            backdrop-filter: blur(5px);
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 18px;
            z-index: 1000;
            border-left: 4px solid #4CAF50;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>📊 測試點位 3D 視覺化</h1>
        <p>案件名稱: <span class="highlight" id="caseName">載入中...</span></p>
        <p>水鎗編號: <span class="highlight" id="gunNumber">載入中...</span></p>
        <p>測試日期: <span id="adjustDate">-</span></p>
        <p>測試人員: <span id="tester">-</span></p>
        <p>測量高度: <span id="measureHeight">-</span> m</p>
        <p>輸入高度: <span id="inputHeight">-</span> m</p>
        <p>點位數量: <span id="pointCount">0</span> 個</p>
    </div>
    
    <!-- 圖例說明 -->
    <div id="legend">
        <h3>📋 圖例說明</h3>
        <div class="legend-item">
            <div class="color-box green"></div>
            <span>預計點位</span>
        </div>
        <div class="legend-item">
            <div class="color-box red"></div>
            <span>實際點位</span>
        </div>
        <div class="legend-item">
            <div class="color-box orange"></div>
            <span>中心點</span>
        </div>
        <div class="legend-item">
            <div class="color-box blue"></div>
            <span>水槍高度位置</span>
        </div>
    </div>
    
    <!-- 右下角容器 -->
    <div id="bottom-right-container">
        <!-- 顯示切換面板 -->
        <div id="toggle-switch">
            <h4>🔘 顯示切換</h4>
            <div class="toggle-option" onclick="document.getElementById('radio-expected').click()">
                <input type="radio" name="pointType" id="radio-expected" value="expected">
                <label for="radio-expected">
                    <span style="color: #4CAF50;">●</span> 僅顯示預計點位
                </label>
                <span class="toggle-badge badge-expected" id="expectedCount">0</span>
            </div>
            <div class="toggle-option" onclick="document.getElementById('radio-actual').click()">
                <input type="radio" name="pointType" id="radio-actual" value="actual">
                <label for="radio-actual">
                    <span style="color: #e74c3c;">●</span> 僅顯示實際點位
                </label>
                <span class="toggle-badge badge-actual" id="actualCount">0</span>
            </div>
            <div class="toggle-option" onclick="document.getElementById('radio-both').click()">
                <input type="radio" name="pointType" id="radio-both" value="both" checked>
                <label for="radio-both">
                    <span style="color: #4CAF50;">●</span><span style="color: #e74c3c;">●</span> 同時顯示兩者
                </label>
            </div>
        </div>
        
        <!-- 角度對應面板 -->
        <div class="coordinate-note">
            <strong>📐 角度對應：</strong><br>
            線性轉換：28→0°, 153→90°, 278→180°
			HTBO/Jim 2026/3/17
        </div>
    </div>
    
    <div id="controls-note">
        🖱️ 滑鼠左鍵拖曳自由旋轉 | 滾輪縮放 | 右鍵拖曳平移 | 懸停點位顯示詳細資訊
    </div>
    
    <div class="point-tooltip" id="pointTooltip"></div>
    
    <button class="close-btn" onclick="window.close()">✕ 關閉視窗</button>
    
    <div class="loading" id="loading">載入 3D 場景中...</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ============================================
        // 解析 URL 參數中的資料
        // ============================================
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // 從 URL 獲取資料
        let viewerData = null;
        const dataParam = getQueryParam('data');
        const useLocalStorage = getQueryParam('useLocalStorage');
        
        console.log('URL 參數:', { dataParam: dataParam ? '存在' : '不存在', useLocalStorage });
        
        if (dataParam) {
            try {
                viewerData = JSON.parse(decodeURIComponent(dataParam));
                console.log('從 URL 載入資料成功');
            } catch (e) {
                console.error('解析 URL 資料失敗:', e);
            }
        }
        
        // 如果沒有 URL 參數或解析失敗，嘗試從 localStorage 讀取
        if (!viewerData && useLocalStorage) {
            try {
                const savedData = localStorage.getItem('calibration3DData');
                if (savedData) {
                    viewerData = JSON.parse(savedData);
                    console.log('從 localStorage 載入資料成功');
                }
            } catch (e) {
                console.error('從 localStorage 讀取失敗:', e);
            }
        }

        // 如果還是沒有資料，顯示錯誤
        if (!viewerData) {
            document.getElementById('loading').style.display = 'none';
            document.body.innerHTML = `
                <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: #2c3e50;">
                    <div style="text-align: center; padding: 40px; background: rgba(255,255,255,0.1); border-radius: 10px; box-shadow: 0 0 30px rgba(0,0,0,0.5); backdrop-filter: blur(10px); color: white; max-width: 500px;">
                        <h2 style="color: #FF5722; margin-bottom: 20px;">❌ 無法載入資料</h2>
                        <p style="margin-bottom: 20px; color: #ccc;">請先從主程式開啟測試點位 3D 圖功能。</p>
                        <p style="margin-bottom: 30px; font-size: 12px; color: #888;">如果問題持續發生，請重新整理主程式後再試。</p>
                        <button onclick="window.close()" style="padding: 12px 30px; background: #FF5722; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; transition: all 0.3s;">關閉視窗</button>
                    </div>
                </div>
            `;
            throw new Error('無法載入資料');
        }

        console.log('載入的資料:', viewerData);

        // ============================================
        // 更新 UI 資訊
        // ============================================
        document.getElementById('caseName').textContent = viewerData.caseName || '-';
        document.getElementById('gunNumber').textContent = viewerData.gunNumber || '-';
        document.getElementById('adjustDate').textContent = viewerData.adjustDate || '-';
        document.getElementById('tester').textContent = viewerData.tester || '-';
        document.getElementById('measureHeight').textContent = viewerData.measureHeight || '0';
        document.getElementById('inputHeight').textContent = viewerData.inputHeight || '0';
        
        // 隱藏載入中
        document.getElementById('loading').style.display = 'none';

        // ============================================
        // 工具函數：將水平步距轉換為角度
        // ============================================
        function stepToAngle(step) {
            // 步距 28 = 0°, 步距 153 = 90°, 步距 278 = 180°
            if (step <= 153) {
                return (step - 28) * (90 - 0) / (153 - 28);
            } else {
                return 90 + (step - 153) * (180 - 90) / (278 - 153);
            }
        }

        // ============================================
        // 工具函數：將角度和距離轉換為 X, Y 座標
        // ============================================
        function calculatePosition(step, distance) {
            const angleDeg = stepToAngle(step);
            const angleRad = angleDeg * Math.PI / 180;
            const x = distance * Math.cos(angleRad);
            const y = distance * Math.sin(angleRad);
            return { x, y, angleDeg };
        }

        // ============================================
        // Three.js 初始化 - 調亮背景色
        // ============================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2c3e50);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 15, 30);
        camera.lookAt(0, 10, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setClearColor(0x2c3e50);
        document.body.appendChild(renderer.domElement);

        // CSS2 渲染器用於文字標籤
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // ============================================
        // 控制器設定
        // ============================================
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;
        controls.maxPolarAngle = Math.PI;
        controls.minPolarAngle = 0;
        controls.minDistance = 5;
        controls.maxDistance = 150;
        controls.target.set(0, 10, 0);
        controls.enableRotate = true;
        controls.rotateSpeed = 1.0;

        // ============================================
        // 添加光源 (調亮)
        // ============================================
        const ambientLight = new THREE.AmbientLight(0x606080);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(10, 30, 10);
        dirLight.castShadow = true;
        dirLight.receiveShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        const d = 30;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.camera.near = 1;
        dirLight.shadow.camera.far = 60;
        scene.add(dirLight);

        const fillLight = new THREE.PointLight(0x6688cc, 1.0);
        fillLight.position.set(-15, 10, 15);
        scene.add(fillLight);
        
        const backLight = new THREE.PointLight(0x88aadd, 0.6);
        backLight.position.set(0, 10, -20);
        scene.add(backLight);

        // ============================================
        // 添加輔助元素
        // ============================================
        // 地板網格
        const gridHelper = new THREE.GridHelper(60, 20, 0xaaccff, 0x5577aa);
        gridHelper.rotation.x = Math.PI / 2;
        gridHelper.position.z = 0;
        scene.add(gridHelper);

        // 參考平面
        const planeGeometry = new THREE.PlaneGeometry(60, 60);
        const planeMaterial = new THREE.MeshPhongMaterial({ color: 0x2a3a5a, side: THREE.DoubleSide, transparent: true, opacity: 0.25 });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = 0;
        plane.rotation.y = 0;
        plane.position.z = 0;
        plane.receiveShadow = true;
        scene.add(plane);

        // 中心軸
        const axesHelper = new THREE.AxesHelper(20);
        scene.add(axesHelper);

        // 環境霧
        scene.fog = new THREE.FogExp2(0x2c3e50, 0.015);

        // ============================================
        // 繪製測試點位
        // ============================================
        const pointsGroup = new THREE.Group();

        // 顏色定義
        const colors = {
            expected: {
                base: 0x4CAF50,   // 綠色
                center: 0xFF5722,  // 橙色
            },
            actual: {
                base: 0xe74c3c,    // 紅色
                center: 0xFF5722,  // 橙色
            }
        };

        // 獲取輸入高度
        const inputHeight = parseFloat(viewerData.inputHeight) || 0;

        // 添加原點標記
        const originSphere = new THREE.Mesh(
            new THREE.SphereGeometry(0.4, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0xFFFFFF, emissive: 0x333333, emissiveIntensity: 0.3 })
        );
        originSphere.position.set(0, 0, 0);
        originSphere.castShadow = true;
        originSphere.receiveShadow = true;
        originSphere.userData = { type: 'origin' };
        pointsGroup.add(originSphere);

        // 原點標籤
        const originLabelDiv = document.createElement('div');
        originLabelDiv.textContent = '水鎗位置 (原點)';
        originLabelDiv.style.color = 'white';
        originLabelDiv.style.backgroundColor = 'rgba(0,0,0,0.8)';
        originLabelDiv.style.padding = '4px 8px';
        originLabelDiv.style.borderRadius = '4px';
        originLabelDiv.style.fontSize = '12px';
        originLabelDiv.style.borderLeft = '3px solid white';
        originLabelDiv.style.fontWeight = 'bold';
        const originLabel = new CSS2DObject(originLabelDiv);
        originLabel.position.set(0, 0, 1);
        originLabel.userData = { type: 'origin-label' };
        pointsGroup.add(originLabel);

        // 添加水槍高度位置的藍色球體
        if (inputHeight > 0) {
            const heightSphere = new THREE.Mesh(
                new THREE.SphereGeometry(0.5, 32, 32),
                new THREE.MeshStandardMaterial({ 
                    color: 0x3498db, 
                    emissive: 0x113366,
                    emissiveIntensity: 0.3,
                    transparent: true,
                    opacity: 0.8
                })
            );
            heightSphere.position.set(0, 0, -inputHeight);
            heightSphere.castShadow = true;
            heightSphere.receiveShadow = true;
            heightSphere.userData = { 
                type: 'height',
                height: inputHeight
            };
            pointsGroup.add(heightSphere);
            
            const heightLabelDiv = document.createElement('div');
            heightLabelDiv.textContent = `水槍高度: ${inputHeight.toFixed(2)}m`;
            heightLabelDiv.style.color = '#3498db';
            heightLabelDiv.style.backgroundColor = 'rgba(0,0,0,0.8)';
            heightLabelDiv.style.padding = '4px 8px';
            heightLabelDiv.style.borderRadius = '4px';
            heightLabelDiv.style.fontSize = '12px';
            heightLabelDiv.style.borderLeft = '3px solid #3498db';
            heightLabelDiv.style.fontWeight = 'bold';
            const heightLabel = new CSS2DObject(heightLabelDiv);
            heightLabel.position.set(0, 0.8, -inputHeight);
            heightLabel.userData = { type: 'height-label' };
            pointsGroup.add(heightLabel);
            
            const dashMaterial = new THREE.LineDashedMaterial({ color: 0x3498db, dashSize: 0.3, gapSize: 0.2, transparent: true, opacity: 0.4 });
            const linePoints = [
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, -inputHeight)
            ];
            const lineGeo = new THREE.BufferGeometry().setFromPoints(linePoints);
            const dashLine = new THREE.Line(lineGeo, dashMaterial);
            dashLine.computeLineDistances();
            dashLine.userData = { type: 'height-line' };
            pointsGroup.add(dashLine);
        }

        // 儲存所有點位用於工具提示和切換
        const pointObjects = [];
        let expectedCount = 0;
        let actualCount = 0;

        // 檢查是否有測試點位
        const hasTestPoints = viewerData.testPoints && viewerData.testPoints.length > 0;

        console.log('資料狀態:', { 
            hasTestPoints, 
            pointCount: viewerData.testPoints?.length || 0 
        });

        // 用於統計
        let centerCount = 0;

        // 遍歷測試點位
        if (hasTestPoints) {
            viewerData.testPoints.forEach((point, index) => {
                // 解析預計數據
                const expectedStep = parseInt(point.expectedHorizontalStep) || 0;
                const expectedDistance = parseFloat(point.expectedDistance) || 0;
                
                // 解析實際數據
                const actualStep = parseInt(point.actualHorizontalStep) || 0;
                const actualDistance = parseFloat(point.actualDistance) || 0;
                
                // 獲取項目名稱
                const itemName = point.item || '測試點位';
                
                // ===== 繪製預計測試點位 =====
                if (expectedStep !== 0 && expectedDistance !== 0) {
                    const { x, y, angleDeg } = calculatePosition(expectedStep, expectedDistance);
                    
                    // 決定點位顏色
                    let pointColor = colors.expected.base;
                    let pointCategory = '一般';
                    
                    if (itemName.includes('中心點') || expectedStep === 153) {
                        pointColor = colors.expected.center;
                        pointCategory = '中心點';
                        centerCount++;
                    }

                    // 創建點位球體
                    const sphere = new THREE.Mesh(
                        new THREE.SphereGeometry(0.6, 32, 32),
                        new THREE.MeshStandardMaterial({ 
                            color: pointColor, 
                            emissive: 0x224411,
                            emissiveIntensity: 0.15,
                            roughness: 0.3,
                            metalness: 0.1
                        })
                    );
                    sphere.position.set(x, y, 0);
                    sphere.castShadow = true;
                    sphere.receiveShadow = true;
                    sphere.userData = { 
                        type: 'expected', 
                        point: point,
                        step: expectedStep,
                        distance: expectedDistance,
                        angle: angleDeg,
                        category: pointCategory,
                        x: x,
                        y: y,
                        itemName: itemName,
                        index: index,
                        subType: 'expected'
                    };
                    pointsGroup.add(sphere);

                    // 添加點位標籤
                    const labelDiv = document.createElement('div');
                    labelDiv.textContent = `${itemName} (預計)`;
                    labelDiv.style.color = 'white';
                    labelDiv.style.backgroundColor = 'rgba(0,0,0,0.8)';
                    labelDiv.style.padding = '3px 8px';
                    labelDiv.style.borderRadius = '4px';
                    labelDiv.style.fontSize = '11px';
                    labelDiv.style.borderLeft = `3px solid ${pointColor === colors.expected.center ? '#FF5722' : '#4CAF50'}`;
                    labelDiv.style.whiteSpace = 'nowrap';
                    
                    const label = new CSS2DObject(labelDiv);
                    label.position.set(x, y, 0.8);
                    label.userData = { 
                        type: 'expected-label',
                        linkedPoint: sphere,
                        step: expectedStep,
                        itemName: itemName,
                        index: index
                    };
                    pointsGroup.add(label);

                    // 添加從原點到點位的連線
                    const lineMaterial = new THREE.LineBasicMaterial({ color: 0x88AAFF, transparent: true, opacity: 0.3 });
                    const linePoints = [
                        new THREE.Vector3(0, 0, 0),
                        new THREE.Vector3(x, y, 0)
                    ];
                    const lineGeo = new THREE.BufferGeometry().setFromPoints(linePoints);
                    const line = new THREE.Line(lineGeo, lineMaterial);
                    line.userData = { 
                        type: 'expected-line',
                        linkedPoint: sphere,
                        step: expectedStep
                    };
                    pointsGroup.add(line);

                    // 儲存點位資訊
                    pointObjects.push({
                        mesh: sphere,
                        label: label,
                        line: line,
                        position: new THREE.Vector3(x, y, 0),
                        data: point,
                        step: expectedStep,
                        distance: expectedDistance,
                        angle: angleDeg,
                        category: pointCategory,
                        pointType: 'expected',
                        itemName: itemName
                    });
                    expectedCount++;
                }
                
                // ===== 繪製現場實際測試點位 =====
                if (actualStep !== 0 && actualDistance !== 0) {
                    const { x, y, angleDeg } = calculatePosition(actualStep, actualDistance);
                    
                    // 決定點位顏色
                    let pointColor = colors.actual.base;
                    let pointCategory = '實際一般';
                    
                    if (itemName.includes('中心點') || actualStep === 153) {
                        pointColor = colors.actual.center;
                        pointCategory = '實際中心點';
                    }

                    // 創建點位球體 (使用八面體區分)
                    const sphere = new THREE.Mesh(
                        new THREE.OctahedronGeometry(0.6, 0),
                        new THREE.MeshStandardMaterial({ 
                            color: pointColor, 
                            emissive: 0x331111,
                            emissiveIntensity: 0.15,
                            roughness: 0.4,
                            metalness: 0.1
                        })
                    );
                    sphere.position.set(x, y, 0);
                    sphere.castShadow = true;
                    sphere.receiveShadow = true;
                    sphere.userData = { 
                        type: 'actual', 
                        point: point,
                        step: actualStep,
                        distance: actualDistance,
                        angle: angleDeg,
                        category: pointCategory,
                        x: x,
                        y: y,
                        itemName: itemName,
                        index: index,
                        subType: 'actual'
                    };
                    pointsGroup.add(sphere);

                    // 添加點位標籤
                    const labelDiv = document.createElement('div');
                    labelDiv.textContent = `${itemName} (實際)`;
                    labelDiv.style.color = 'white';
                    labelDiv.style.backgroundColor = 'rgba(0,0,0,0.8)';
                    labelDiv.style.padding = '3px 8px';
                    labelDiv.style.borderRadius = '4px';
                    labelDiv.style.fontSize = '11px';
                    labelDiv.style.borderLeft = `3px solid ${pointColor === colors.actual.center ? '#FF5722' : '#e74c3c'}`;
                    labelDiv.style.whiteSpace = 'nowrap';
                    
                    const label = new CSS2DObject(labelDiv);
                    label.position.set(x, y, 0.8);
                    label.userData = { 
                        type: 'actual-label',
                        linkedPoint: sphere,
                        step: actualStep,
                        itemName: itemName,
                        index: index
                    };
                    pointsGroup.add(label);

                    // 添加從原點到點位的連線
                    const lineMaterial = new THREE.LineBasicMaterial({ color: 0xe67e22, transparent: true, opacity: 0.3 });
                    const linePoints = [
                        new THREE.Vector3(0, 0, 0),
                        new THREE.Vector3(x, y, 0)
                    ];
                    const lineGeo = new THREE.BufferGeometry().setFromPoints(linePoints);
                    const line = new THREE.Line(lineGeo, lineMaterial);
                    line.userData = { 
                        type: 'actual-line',
                        linkedPoint: sphere,
                        step: actualStep
                    };
                    pointsGroup.add(line);

                    // 儲存點位資訊
                    pointObjects.push({
                        mesh: sphere,
                        label: label,
                        line: line,
                        position: new THREE.Vector3(x, y, 0),
                        data: point,
                        step: actualStep,
                        distance: actualDistance,
                        angle: angleDeg,
                        category: pointCategory,
                        pointType: 'actual',
                        itemName: itemName
                    });
                    actualCount++;
                }
            });
        }

        // 更新點位數量顯示
        document.getElementById('pointCount').textContent = pointObjects.length;
        document.getElementById('expectedCount').textContent = expectedCount;
        document.getElementById('actualCount').textContent = actualCount;

        // 更新圖例統計
        const legendDiv = document.getElementById('legend');
        const statsHtml = `
            <h3>📋 圖例說明</h3>
            <div class="legend-item">
                <div class="color-box green"></div>
                <span>預計點位 (${expectedCount})</span>
            </div>
            <div class="legend-item">
                <div class="color-box red"></div>
                <span>實際點位 (${actualCount})</span>
            </div>
            <div class="legend-item">
                <div class="color-box orange"></div>
                <span>中心點 (${centerCount})</span>
            </div>
            <div class="legend-item">
                <div class="color-box blue"></div>
                <span>水槍高度位置</span>
            </div>
        `;
        legendDiv.innerHTML = statsHtml;

        // 將 pointsGroup 加入場景
        scene.add(pointsGroup);

        // 如果沒有點位，顯示提示
        if (pointObjects.length === 0) {
            const warningDiv = document.createElement('div');
            warningDiv.textContent = '⚠️ 沒有任何測試點位資料';
            warningDiv.style.color = '#FF5722';
            warningDiv.style.backgroundColor = 'rgba(0,0,0,0.8)';
            warningDiv.style.padding = '10px 20px';
            warningDiv.style.borderRadius = '5px';
            warningDiv.style.fontSize = '16px';
            warningDiv.style.borderLeft = '4px solid #FF5722';
            const warningLabel = new CSS2DObject(warningDiv);
            warningLabel.position.set(0, 5, 5);
            pointsGroup.add(warningLabel);
        }

        // ============================================
        // 切換顯示邏輯 (修復標籤顯示問題)
        // ============================================
        function updatePointVisibility() {
            const selectedValue = document.querySelector('input[name="pointType"]:checked').value;
            
            pointsGroup.children.forEach(child => {
                // 永遠顯示原點和高度相關的物件
                if (child.userData && (child.userData.type === 'origin' || 
                    child.userData.type === 'origin-label' ||
                    child.userData.type === 'height' ||
                    child.userData.type === 'height-label' ||
                    child.userData.type === 'height-line')) {
                    child.visible = true;
                    return;
                }
                
                // 根據類型決定是否顯示
                if (child.userData && child.userData.type) {
                    if (selectedValue === 'expected') {
                        // 只顯示預計相關
                        if (child.userData.type === 'expected' || 
                            child.userData.type === 'expected-label' ||
                            child.userData.type === 'expected-line') {
                            child.visible = true;
                        } else if (child.userData.type === 'actual' || 
                                 child.userData.type === 'actual-label' ||
                                 child.userData.type === 'actual-line') {
                            child.visible = false;
                        }
                    } else if (selectedValue === 'actual') {
                        // 只顯示實際相關
                        if (child.userData.type === 'actual' || 
                            child.userData.type === 'actual-label' ||
                            child.userData.type === 'actual-line') {
                            child.visible = true;
                        } else if (child.userData.type === 'expected' || 
                                 child.userData.type === 'expected-label' ||
                                 child.userData.type === 'expected-line') {
                            child.visible = false;
                        }
                    } else if (selectedValue === 'both') {
                        // 顯示所有
                        child.visible = true;
                    }
                }
            });
        }

        // 綁定切換事件
        document.querySelectorAll('input[name="pointType"]').forEach(radio => {
            radio.addEventListener('change', updatePointVisibility);
        });

        // 初始化顯示
        setTimeout(() => {
            updatePointVisibility();
        }, 200);

		// ============================================
        // 工具提示功能 (修改版 - 加入水槍本體與點位之間角度)
        // ============================================
        const tooltip = document.getElementById('pointTooltip');
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        renderer.domElement.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // 檢測與所有可見物體的相交
            const allMeshes = [];
            pointsGroup.children.forEach(child => {
                if (child.isMesh && child.visible) {
                    allMeshes.push(child);
                }
            });
            
            const intersects = raycaster.intersectObjects(allMeshes);

            if (intersects.length > 0) {
                const hit = intersects[0].object;
                
                // 處理高度球體
                if (hit.userData && hit.userData.type === 'height') {
                    tooltip.style.display = 'block';
                    tooltip.style.left = (event.clientX + 15) + 'px';
                    tooltip.style.top = (event.clientY - 100) + 'px';
                    
                    tooltip.innerHTML = `
                        <strong style="color: #3498db;">水槍高度位置</strong><br>
                        <span style="color: #88AAFF;">高度:</span> ${hit.userData.height.toFixed(2)} m<br>
                        <span style="color: #88AAFF;">座標:</span> (0, 0, -${hit.userData.height.toFixed(2)})<br>
                    `;
                    return;
                }
                
                // 處理點位
                if (hit.userData && (hit.userData.type === 'expected' || hit.userData.type === 'actual')) {
                    const pointData = hit.userData.point;
                    const pointType = hit.userData.type;
                    
                    // 水平步距
                    const horizontalStep = hit.userData.step;
                    
                    // 垂直步距
                    let verticalStep = '';
                    if (pointType === 'expected') {
                        verticalStep = pointData.expectedVerticalStep || '-';
                    } else {
                        verticalStep = pointData.actualVerticalStep || '-';
                    }
                    
                    const distance = hit.userData.distance;
                    const angle = hit.userData.angle;
                    const xPos = hit.userData.x || hit.position.x;
                    const yPos = hit.userData.y || hit.position.y;
                    
                    // 計算到原點的平面距離 (XY平面)
                    const distanceToOrigin = Math.sqrt(xPos * xPos + yPos * yPos);
                    
                    // 獲取水槍高度 (Z軸)
                    const gunHeight = parseFloat(viewerData.inputHeight) || 0;
                    
                    // 計算水槍本體位置 (0, 0, -gunHeight) 與點位 (xPos, yPos, 0) 之間的三維距離
                    const dx = xPos - 0;
                    const dy = yPos - 0;
                    const dz = 0 - (-gunHeight); // 點位 Z=0, 水槍 Z=-gunHeight, 所以高度差 = gunHeight
                    
                    const threeDimDistance = Math.sqrt(dx*dx + dy*dy + dz*dz);
                    
                    // 計算水槍本體與點位之間的角度 (俯仰角)
                    // 角度 = arctan(高度差 / 水平距離)
                    // 高度差 = gunHeight (因為點位在地面 Z=0，水槍在 Z=-gunHeight)
                    // 水平距離 = distanceToOrigin
                    let gunToPointAngle = 0;
                    if (distanceToOrigin > 0) {
                        // 計算弧度角度
                        const angleRad = Math.atan2(gunHeight, distanceToOrigin);
                        // 轉換為度數
                        gunToPointAngle = angleRad * 180 / Math.PI;
                    }
                    
                    if (pointData) {
                        tooltip.style.display = 'block';
                        tooltip.style.left = (event.clientX + 15) + 'px';
                        tooltip.style.top = (event.clientY - 260) + 'px'; // 再調高一點因為資訊更多
                        
                        const stepInfo = horizontalStep || '-';
                        const distanceInfo = distance ? distance.toFixed(2) : '-';
                        const angleInfo = angle ? angle.toFixed(2) : '-';
                        
                        const typeColor = pointType === 'expected' ? '#4CAF50' : '#e74c3c';
                        const typeText = pointType === 'expected' ? '預計測試' : '現場實際';
                        
                        tooltip.innerHTML = `
                            <strong style="color: ${typeColor};">${pointData.item || '測試點位'} (${typeText})</strong><br>
                            <span style="color: #88AAFF;">水平步距:</span> ${stepInfo}<br>
                            <span style="color: #88AAFF;">垂直步距:</span> ${verticalStep}<br>
                            <span style="color: #88AAFF;">距離:</span> ${distanceInfo} m<br>
                            <span style="color: #88AAFF;">步距角度:</span> ${angleInfo}°<br>
                            <hr style="border: 0.5px solid #333; margin: 5px 0;">
                            <span style="color: #FF5722;">座標與角度:</span><br>
                            <span style="color: #FF5722;">X = ${xPos.toFixed(2)} m</span><br>
                            <span style="color: #FF5722;">Y = ${yPos.toFixed(2)} m</span><br>
                            <span style="color: #FF5722;">平面距離 = ${distanceToOrigin.toFixed(2)} m</span><br>
                            <span style="color: #FF5722;">三維距離 = ${threeDimDistance.toFixed(2)} m</span><br>
                            <span style="color: #FF5722;">水槍俯仰角 = ${gunToPointAngle.toFixed(2)}°</span>
                        `;
                    }
                }
            } else {
                tooltip.style.display = 'none';
            }
        });

        // ============================================
        // 動畫循環
        // ============================================
        function animate() {
            requestAnimationFrame(animate);

            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        animate();

        // ============================================
        // 視窗大小調整
        // ============================================
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                window.close();
            }
        });

        console.log('3D 場景初始化完成，預計點位數量:', expectedCount, '實際點位數量:', actualCount);
    </script>
</body>
</html>
