<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>步驟13 詳細說明</title>
    <style>
        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: white;
            color: #333;
            line-height: 1.6;
        }
        
        /* 合併檔案主表格樣式 - 完全複製 */
        table {
            border-collapse: collapse;
            width: 100%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            background-color: white;
            margin-bottom: 30px;
            border-radius: 8px;
            overflow: hidden;
        }
        
        th, td {
            border: 1px solid #ddd;
            padding: 15px;
            text-align: center;
            transition: background-color 0.2s;
        }
        
        th {
            background: linear-gradient(to bottom, #2c7fb8, #1a6a9c);
            color: white;
            font-weight: bold;
            font-size: 16px;
        }
        
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        
        tr:hover {
            background-color: #e9f7fe;
        }
        
        td:nth-child(3), td:nth-child(4) {
            background-color: #edf8b1;
            font-weight: bold;
        }
        
        td:first-child {
            background-color: #e6f2f8;
            font-weight: bold;
            font-size: 18px;
        }
        
        .note {
            color: red;
            font-weight: bold;
        }
        
        p {
            margin: 10px 0;
        }
        
        strong {
            color: #2c7fb8;
        }
    </style>
</head>
<body>
           <p><strong>步驟13：確認槍未轉出無法手動放水</strong></p>
	
</body>
</html>
